databases:
  - name: unisense-db
    plan: free
    databaseName: unisense
    user: unisense

services:
  - type: web
    name: unisense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run:app --host 0.0.0.0 --port $PORT
    envVars:
      # Conexão do Postgres injetada automaticamente pelo Render (sem copiar à mão).
      - key: DATABASE_URL
        fromDatabase:
          name: unisense-db
          property: connectionString
      # Estes dois você define no painel (estão no seu .env local).
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
